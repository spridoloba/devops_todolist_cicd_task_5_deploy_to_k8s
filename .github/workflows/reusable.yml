name: Deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string


jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Helm Package
        uses: actions/download-artifact@v4
        with:
          name: helm-package
          path: .

      - name: Create cluster
        uses: helm/kind-action@v1.10.0
        with:
          config: cluster.yml

      - name: Setup helm
        uses: azure/setup-helm@v4.2.0

      - name: Helm Dry-Run
        run: |
          helm install todoapp ./todoapp-*.tgz \
            --dry-run --debug \
            --set todoapp.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/todoapp \
            --set todoapp.image.tag=${{ github.sha }}

      - name: Helm Upgrade
        run: |
          helm upgrade --install todoapp ./todoapp-*.tgz \
            --atomic \
            --wait \
            --timeout 5m \
            --set todoapp.image.repository=${{ secrets.DOCKERHUB_USERNAME }}/todoapp \
            --set todoapp.image.tag=${{ github.sha }}